name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Parity tests (TypeScript ports vs 1,400 cases generated from the real Python)
        run: npm run test:parity
      - run: npm run build
      - name: Broken-link check (every internal href, src and #anchor in out/)
        run: npm run test:links
      - name: End-to-end smoke tests (Verify/Zen/palette, ?for=, contact form, honeypot, essays, 404)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Lighthouse budget (mobile)
        run: |
          npx serve out -l 4300 &
          npx wait-on http://localhost:4300 --timeout 30000
          npm run test:lh
